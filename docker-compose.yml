services:
  web:
    build: .
    image: fboucher/la-pause:latest
    container_name: la-pause-web
    ports:
      - "3000:3000"
    volumes:
      - lapause-data:/app/data
    env_file:
      - .env
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-onboarding@resend.dev}
    restart: unless-stopped

volumes:
  lapause-data:

