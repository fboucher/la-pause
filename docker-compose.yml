services:
  web:
    build: .
    image: fboucher/la-pause:latest
    container_name: la-pause-web
    ports:
      - "3000:3000"
    volumes:
      - lapause-data:/app/data
    env_file:
      - .env
    environment:
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@exemple.com}
    restart: unless-stopped

volumes:
  lapause-data:

